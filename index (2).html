.q{font-weight:900;text-transform:uppercase;font-size:1.15rem;text-align:center;margin:0}
.bar{height:12px;background:var(--line);border-radius:10px;margin:12px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--hi);transition:width 1s linear}
.tm{font-weight:900;font-size:1.3rem;color:var(--ink)}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--row);color:var(--ink);font:inherit;font-weight:800;text-transform:uppercase;padding:.8rem 1rem;cursor:pointer;text-align:left;font-size:1rem}
.row:last-child{border-bottom:0}
.row[aria-pressed="true"]{background:var(--hi)}
.row[aria-pressed="true"].neg{background:var(--bomb);color:#fff}
.row .p{font-weight:900;min-width:2rem;text-align:right}
.sc{display:flex;justify-content:space-between;font-weight:800}
.tog{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line);font-weight:800}
.tog input{width:44px;height:24px;accent-color:var(--teal)}
input.t{width:100%;font:inherit;font-size:1.1rem;padding:.8rem 1rem;border-radius:12px;border:3px solid var(--line);margin:6px 0 12px;color:var(--ink);background:#fff}
select.t{width:100%;font:inherit;font-size:1.1rem;padding:.8rem 1rem;border-radius:12px;border:3px solid var(--line);margin:6px 0 12px;color:var(--ink);background:#fff}
.row.ok{background:#0E8A4F;color:#fff;cursor:default}.row.ko{background:#C62828;color:#fff;cursor:default}.row.nt{opacity:.6;cursor:default}
table{width:100%;border-collapse:collapse;font-weight:700}td,th{padding:.45rem .3rem;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}tr.tot td{font-weight:900;border-bottom:0}
.big{font-size:2.6rem;font-weight:900;color:var(--red);text-align:center}
.lg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 10px}.lg button{border:2px solid #fff;background:transparent;color:#fff;font:inherit;font-weight:800;border-radius:20px;padding:.45rem .9rem;cursor:pointer}.lg button.on{background:#fff;color:var(--ink)}
html[dir="rtl"] .row,html[dir="rtl"] th:first-child,html[dir="rtl"] td:first-child{text-align:right}
.jks{display:flex;gap:10px;justify-content:center;margin:14px 0}.jks button{width:76px;height:76px;border-radius:18px;border:3px solid transparent;background:#fff;color:var(--red);font:inherit;font-size:2rem;font-weight:900;cursor:pointer}.jks button[aria-pressed="true"]{background:var(--hi);color:#fff;border-color:#fff}.jks button:disabled{opacity:.35;cursor:not-allowed}
.pb{margin:14px 0}.pb .t{display:flex;justify-content:space-between;font-weight:900}.pb .b{height:18px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:5px}.pb .b i{display:block;height:100%;background:var(--hi);border-radius:10px;transition:width .6s}.trophy{font-size:5rem;text-align:center;line-height:1}

.miss{opacity:.75;font-size:.95rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.btn:active{transform:none}}
</style>
</head>

 app.innerHTML='<h2>'+T("tt")+'</h2><div class="card"><label>'+T("nt")+'<select class="t" id="nn"><option>2</option><option>3</option><option>4</option></select></label><div id="tn"></div><label>'+T("ln")+'<select class="t" id="nr">'+[6,10,16].map(function(n){return'<option value="'+n+'">'+n+' '+T("rd")+'</option>'}).join("")+'</select></label></div><button class="btn red" id="go">'+T("go")+'</button><button class="btn yel sm" id="bk">'+T("back")+'</button>';
 function names(){var n=+$("nn").value,h="";for(var i=1;i<=n;i++)h+='<label>'+T("e"+i)+'<input class="t" id="n'+i+'" placeholder="'+T("p"+i)+'" maxlength="14"></label>';$("tn").innerHTML=h}
 names();$("nn").onchange=names;$("bk").onclick=home;
 $("go").onclick=function(){var N=+$("nn").value,nm=[],i;for(i=1;i<=N;i++)nm.push(clean($("n"+i).value,T("e"+i)));
  var z=function(v){return nm.map(function(){return v})};
  G={n:nm,pts:z(0),r:0,qs:pick(Math.ceil(+$("nr").value/N)*N,N),u:nm.map(function(){return{}}),tm:z(60),ch:z(0),h:[]};handoff()}}
function handoff(){
 var N=G.n.length,g=G.r%N,l=(g+1)%N,d0=G.qs[G.r],alt=null;G.jk=null;
 if(G.ch[g]){if(!G.alt){var pp=pick(2);G.alt=pp[0]||null}alt=G.alt}
 var q=qx(d0);
 if(alt){var q2=qx(alt);
  app.innerHTML='<div class="c"><p>ROUND '+(G.r+1)+'/'+G.qs.length+'</p><p><b>'+T("ch")+'</b></p></div><div class="card"><p class="q">'+q[0]+'</p></div><button class="btn yel sm" id="c1">'+T("cs")+'</button><div class="card"><p class="q">'+q2[0]+'</p></div><button class="btn yel sm" id="c2">'+T("cs")+'</button>';
  $("c1").onclick=function(){G.ch[g]=0;G.alt=null;handoff()};
  $("c2").onclick=function(){G.qs[G.r]=alt;G.ch[g]=0;G.alt=null;handoff()};return}
 app.innerHTML='<div class="c"><p>ROUND '+(G.r+1)+'/'+G.qs.length+'</p></div><div class="card"><p class="q">'+q[0]+'</p></div>'+(G.tm[g]!=60?'<p class="c"><b>⏱ '+G.tm[g]+' s</b></p>':'')+'<p class="c">'+T("jk")+'</p><div class="jks">'+["p","x","q"].map(function(k){return'<button data-k="'+k+'" aria-pressed="false" aria-label="Joker '+JL[k]+'"'+(G.u[g][k]?" disabled":"")+'>'+JL[k]+'</button>'}).join("")+'</div><p class="c" style="font-size:.85rem">'+T("jkh")+'</p><h2 class="c">'+T("cp")+'</h2><button class="btn red" id="rd">'+T("jo")+'</button><div class="card"><p style="margin:0">'+T("hd").replace("{a}",G.n[l]).replace("{b}",G.n[g])+'</p></div>';
 var bs=document.querySelectorAll(".jks button");
 bs.forEach(function(b){b.onclick=function(){var on=b.getAttribute("aria-pressed")!="true";bs.forEach(function(x){x.setAttribute("aria-pressed","false")});b.setAttribute("aria-pressed",on?"true":"false");G.jk=on?b.dataset.k:null}});
 $("rd").onclick=play}
function play(){
 var N=G.n.length,g=G.r%N,q=qx(G.qs[G.r]),items=shuf(q[1].split(",").map(function(s){var i=s.lastIndexOf(":");return{n:s.slice(0,i),p:+s.slice(i+1),on:0}})),TT=G.tm[g]||60,left,iv,score=0,j=G.jk,o=j,eff="";
 G.tm[g]=60;
 if(j){G.u[g][j]=1;if(j=="q"){o=["t","m","c","b","x"][Math.floor(Math.random()*5)];if(o=="t")TT=75;if(o=="m")G.tm[(g+1)%N]=45;if(o=="c")G.ch[g]=1;eff={t:T("eft"),m:T("efm"),c:T("efc"),b:T("efb"),x:"×2"}[o]}}
 left=TT;
 app.innerHTML='<div class="card"><p class="q">'+q[0]+'</p>'+(eff?'<p class="c"><b>? → '+eff+'</b></p>':'')+'<div class="bar"><i id="pg"></i></div><div class="sc"><span class="tm" id="tm">'+TT+'</span><span>'+T("sc")+' : <b id="sc">0</b></span></div></div><div class="list" id="ls"></div><button class="btn yel sm" id="fin">'+T("fn")+'</button>';
 var ls=$("ls");
 items.forEach(function(it){var b=document.createElement("button");b.className="row"+(it.p<0?" neg":"");b.setAttribute("aria-pressed","false");
  b.innerHTML="<span>"+(it.p<0?"💣 ":"")+it.n+'</span><span class="p">'+it.p+"</span>";
  b.onclick=function(){it.on=!it.on;b.setAttribute("aria-pressed",it.on?"true":"false");score+=it.on?it.p:-it.p;$("sc").textContent=score};ls.appendChild(b)});
 setTimeout(function(){$("pg").style.width=((TT-1)/TT*100)+"%"},50);
 iv=setInterval(function(){left--;$("tm").textContent=left;$("pg").style.width=(left/TT*100)+"%";if(left<=10)$("tm").className="tm low";if(left<=0)end()},1000);
 $("fin").onclick=end;
 function end(){clearInterval(iv);var fs=score,lab="",pos=items.filter(function(i){return i.on&&i.p>0}).length,bm=items.filter(function(i){return i.on&&i.p<0}).length;
  if(o=="p"){fs=score+2*pos;lab="+2"}else if(o=="x"){fs=score*2;lab="×2"}else if(o=="b"){fs=score+5*bm;lab=T("efb")}else if(o=="t")lab=T("eft");else if(o=="m")lab=T("efm");else if(o=="c")lab=T("efc");
  if(j=="q"&&lab)lab="? → "+lab;
  G.pts[g]+=fs;result(items,fs,lab)}}
function result(items,score,lab){
 var g=G.r%G.n.length;
 var rows=items.map(function(i){var c,t;if(i.p>0){c=i.on?"ok":"ko";t=i.on?"✓ ":"✗ "}else{c=i.on?"ko":"nt";t="💣 "}
  return'<div class="row '+c+'"><span>'+t+i.n+'</span><span class="p">'+(i.p<0&&!i.on?T("av"):i.p)+'</span></div>'}).join("");
 app.innerHTML='<h2 class="c">'+T("ro")+'</h2><div class="card"><div class="big">'+(score>0?"+":"")+score+' '+T("pt")+'</div><p class="c">'+T("fo")+' '+G.n[g]+(lab?" – "+T("jn")+" "+lab:"")+'</p></div><h2>'+T("rc")+'</h2><p>'+T("lg")+'</p><div class="list">'+rows+'</div><button class="btn red" id="nx">'+T("sv")+'</button>';
 $("nx").onclick=scores;window.scrollTo(0,0)}
function bars(m){return G.n.map(function(nm,i){return'<div class="pb"><div class="t"><span>'+nm+'</span><span>'+G.pts[i]+' '+T("pt")+'</span></div><div class="b"><i style="width:'+Math.max(0,G.pts[i]/m*100)+'%"></i></div></div>'}).join("")}
function scores(){
 var last=G.r==G.qs.length-1,m=Math.max.apply(null,[1].concat(G.pts));
 app.innerHTML='<h2 class="c">'+T("scT")+'</h2><div class="card">'+bars(m)+'</div><button class="btn red" id="nx">'+(last?T("sr"):T("nx"))+'</button>';
 $("nx").onclick=function(){if(last)fin();else{G.r++;handoff()}};window.scrollTo(0,0)}
function fin(){
 var m=Math.max.apply(null,G.pts),w=G.n.filter(function(x,i){return G.pts[i]==m}),t=w.length>1?T("eq"):w[0]+" "+T("win");
 app.innerHTML='<div class="trophy">🏆</div><h1><b>'+t+'</b></h1><div class="card">'+bars(Math.max(1,m))+'</div><button class="btn teal" id="again">'+T("rv")+'</button><button class="btn red" id="hm">'+T("mu")+'</button>';
 $("again").onclick=function(){var n=G.n,N=n.length,z=function(v){return n.map(function(){return v})};G={n:n,pts:z(0),r:0,qs:pick(G.qs.length,N),u:n.map(function(){return{}}),tm:z(60),ch:z(0),h:[]};handoff()};$("hm").onclick=home}
</script>
