html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;background:radial-gradient(circle at 50% 0,var(--bg) 0,var(--bg2) 100%) fixed}

h1{font-size:3.4rem;line-height:1;text-align:center}

h2{font-size:1.6rem;margin-bottom:10px}
p{margin:.5rem 0;line-height:1.45}
.c{text-align:center}
.btn{display:block;width:100%;border:0;border-radius:40px;padding:.95rem 1rem;margin:12px 0;font:inherit;font-size:1.25rem;font-weight:900;letter-spacing:.02em;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}

button:focus-visible,input:focus-visible,.row:focus-visible{outline:4px solid #fff;outline-offset:2px}
.card{background:var(--card);color:var(--ink);border-radius:18px;padding:16px;margin:14px 0}
.q{font-weight:900;text-transform:uppercase;font-size:1.15rem;text-align:center;margin:0}
.bar{height:12px;background:var(--line);border-radius:10px;margin:12px 0 4px;overflow:hidden}

.tm{font-weight:900;font-size:1.3rem;color:var(--ink)}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin:12px 0}

.row[aria-pressed="true"].neg{background:var(--bomb);color:#fff}
.row .p{font-weight:900;min-width:2rem;text-align:right}
.sc{display:flex;justify-content:space-between;font-weight:800}

.tog input{width:44px;height:24px;accent-color:var(--teal)}

:root{--vio:#7A3FE0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:160px;border:0;border-radius:22px;color:#fff;font-family:inherit;cursor:pointer;padding:12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tile:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tile .ti{font-size:3rem;line-height:1}.tile .tn{font-weight:900;font-size:1.15rem}.tile .ts{font-size:.8rem;opacity:.92}
.t1{background:#16A5A0}

</head>

function pri(list,seen){var u=[],s=[];list.forEach(function(x){(seen[x.id]?s:u).push(x)});return shuf(u).concat(shuf(s))}
function cyc(ls){var out=[],i=0,go=1;while(go){go=0;ls.forEach(function(l){if(i<l.length){out.push(l[i]);go=1}});i++}return out}
function ordered(kind,fams,count){var seen=sload()[kind],lvv=LV;
 function build(fl){return fams.map(function(f){var it=f.items,pool;if(fl=="a"){var b={e:[],m:[],h:[]};it.forEach(function(x){b[x.l].push(x)});pool=cyc([pri(b.e,seen),pri(b.m,seen),pri(b.h,seen)])}else pool=pri(it.filter(function(x){return x.l==fl}),seen);return{w:f.w,p:pool,i:0}})}
 function take(lists,n,out){var guard=0;while(out.length<n&&guard++<n*40){var any=0;lists.forEach(function(f){for(var k=0;k<f.w&&out.length<n;k++){if(f.i<f.p.length){out.push(f.p[f.i++]);any=1}}});if(!any)break}return out}
 var out=take(build(lvv),count,[]);
 if(out.length<count){var have={};out.forEach(function(x){have[x.id]=1});var more=take(build("a"),count*3,[]).filter(function(x){return!have[x.id]});out=out.concat(more.slice(0,count-out.length))}
 return out}
var FAMS={v:VFam,p:PMam,w:WHam,n:NMam},PER={v:45,p:45,w:25,n:14};
function norm(k,x){if(k=="n")return x;if(k=="v")return{id:x.id,s:x.s,a:x.a};if(k=="p"){var sw=Math.random()<.5;return{id:x.id,q:x.q,o:sw?[x.B,x.A]:[x.A,x.B],a:sw?1:0}}return{id:x.id,n:x.n,c:x.c}}
modeScreen=function(){
 app.innerHTML='<h2>'+T("mc")+'</h2><div class="tiles">'+TL.slice(0,5).map(function(t,i){return tileHTML(t,false).replace('class="tile','class="tile'+(i==4?' wide':''))}).join("")+'</div><button class="btn red sm" id="bk" style="margin-top:16px">'+T("back")+'</button>';
 document.querySelectorAll(".tile").forEach(function(b){b.onclick=function(){if(b.dataset.g=="z"){multiScreen();return}SEL.gm=b.dataset.g;setScreen()}});
 $("bk").onclick=home};
window.multiScreen=function(){
 app.innerHTML='<h2>'+T("mcz")+'</h2><div class="tiles">'+TL.slice(5).map(function(t,i){return tileHTML(t,false).replace('class="tile','class="tile'+(i==4?' wide':''))}).join("")+'</div><button class="btn red sm" id="bk" style="margin-top:16px">'+T("back")+'</button>';
 document.querySelectorAll(".tile").forEach(function(b){b.onclick=function(){SEL.gm=b.dataset.g;setScreen()}});
 $("bk").onclick=modeScreen};
var _ss=setScreen;setScreen=function(){_ss();if("vpwyn".indexOf(SEL.gm)>=0){var l=document.getElementById("lvr");if(l)l.hidden=false;var b=document.getElementById("bk");if(b)b.onclick=window.multiScreen}};
var _mk=mkRounds;mkRounds=function(mode,total,N){if("vpwyn".indexOf(mode)<0)return _mk(mode,total,N);
 var kinds=[],i,cnt={v:0,p:0,w:0,n:0};for(i=0;i<total;i++){var t=mode=="y"?["v","p","w","n"][((i%N)+Math.floor(i/N))%4]:mode;kinds.push(t);cnt[t]++}
 var lists={};["v","p","w","n"].forEach(function(k){if(cnt[k])lists[k]=ordered(k,FAMS[k],cnt[k]*PER[k]+10)});
 var pos={v:0,p:0,w:0,n:0};return kinds.map(function(k){var s=lists[k].slice(pos[k],pos[k]+PER[k]);if(s.length<PER[k]){s=s.concat(lists[k].slice(0,PER[k]-s.length))}pos[k]+=PER[k];return{t:k,w:shuf(s).map(function(x){return norm(k,x)})}})};
var _ty=typed;typed=function(x){if("vpwn".indexOf(x.t)>=0)multi(x);else _ty(x)};
function multi(x){var N=G.n.length,g=G.r%N;
 app.innerHTML='<div class="c"><p>ROUND '+(G.r+1)+'/'+G.qs.length+'</p><h2>'+T("tn"+x.t)+'</h2></div><div class="card"><p style="margin:0">'+T("r"+x.t).replace("{a}",G.n[g])+'</p></div><button class="btn red" id="st">'+T("stt")+'</button>';
 $("st").onclick=function(){run(x,g)}}
function run(x,g){var t=x.t,DUR=t=="v"?30:60,left=DUR,i=0,sc=0,res=[],iv,dn=0,lock=0,k=0,it,l=li();
 app.innerHTML='<div class="card c"><div class="bar"><i id="pg"></i></div><div class="sc"><span class="tm" id="tm">'+DUR+'</span><span>'+T("sc")+' : <b id="sc">0</b></span></div><p class="q" style="font-size:'+(t=="w"?"1.2rem":t=="n"?"1.3rem":"1.6rem")+';margin:18px 0" id="wd"></p><p class="miss" id="an"></p></div><div id="opts"></div><button class="btn red sm" id="stop">'+T("fn")+'</button>';
 function end(){if(dn)return;dn=1;clearInterval(iv);ssave();G.pts[g]+=sc;typedRes(g,sc,res)}
 function upd(){$("sc").textContent=sc}
 function btn(id,cls,txt,fn){var b=document.createElement("button");b.className="btn "+cls;b.id=id;b.textContent=txt;b.onclick=fn;$("opts").appendChild(b)}
 function show(){lock=0;if(i>=x.w.length){end();return}it=x.w[i];mark(t,it.id);$("opts").innerHTML="";$("an").textContent="";k=0;
  if(t=="v"){$("wd").textContent=it.s[l];btn("a1","teal",T("tru"),function(){ans(1)});btn("a0","red",T("fls"),function(){ans(0)})}
  else if(t=="p"){$("wd").textContent=it.q[l];btn("a0","teal",it.o[0][l],function(){ans(0)});btn("a1","yel",it.o[1][l],function(){ans(1)})}
  else if(t=="n")numq();else{$("an").textContent=T("ansl")+" : "+it.n[l];clue()}}

 function fmt(v){return String(v).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
 function numq(){var tr=0;$("wd").textContent=it.q[l];$("an").textContent=it.t?T("mrg")+" : ±"+fmt(it.t):"";
  $("opts").innerHTML='<input id="ni" class="t" type="number" step="any" inputmode="decimal" style="width:100%;text-align:center;font-size:1.6rem;margin-bottom:8px" placeholder="?"><div id="fb" class="c" style="font-weight:900;font-size:1.3rem;min-height:1.8rem;margin-bottom:8px"></div>';
  btn("ok","teal",T("vld"),guess);btn("pn","red sm",T("pas"),function(){reveal(0)});
  var ni=$("ni");ni.onkeydown=function(e){if(e.key=="Enter")guess()};try{ni.focus()}catch(e){}
  function nextq(){if(dn)return;i++;show()}
  function reveal(ok){if(lock||dn)return;lock=1;$("fb").textContent=T("ansl")+" : "+fmt(it.v);if(!ok)res.push([it.q[l]+" → "+fmt(it.v),0]);setTimeout(nextq,1100)}
  function guess(){if(lock||dn)return;var g=parseFloat(ni.value);if(isNaN(g))return;tr++;
   if(Math.abs(g-it.v)<=it.t+1e-9){var p=tr==1?3:tr==2?2:1;sc+=p;upd();res.push([it.q[l]+" → "+fmt(it.v),1]);$("fb").style.color="#1f9d55";reveal(1);$("fb").textContent="✓ "+fmt(it.v)+" (+"+p+")"}
   else if(tr>=5){$("fb").style.color="#d64545";reveal(0)}
   else{$("fb").style.color=g<it.v?"#2D7FF9":"#d64545";$("fb").textContent=(g<it.v?"⬆ "+T("mor"):"⬇ "+T("les"))+"  ("+fmt(g)+")  "+tr+"/5";ni.value="";try{ni.focus()}catch(e){}}}}
 function clue(){var h="";for(var j=0;j<=k;j++)h+=(j+1)+". "+it.c[j][l]+"<br>";$("wd").innerHTML=h;$("opts").innerHTML="";
  btn("yes","teal",T("fnd")+" (+"+(3-k)+")",function(){res.push([it.n[l],1]);sc+=3-k;upd();i++;show()});
  if(k<2)btn("nx","yel",T("nxc"),function(){k++;clue()});
  btn("no","red sm",T("pas"),function(){res.push([it.n[l],0]);i++;show()})}
 function ans(c){if(lock||dn)return;lock=1;var ok=(c==it.a);sc+=ok?1:-1;upd();
  var lab=t=="v"?it.s[l]+" — "+(it.a?T("tru"):T("fls")):it.q[l]+" "+it.o[it.a][l];res.push([lab,ok?1:0]);
  var b=document.getElementById("a"+c);if(b)b.style.opacity=".55";$("wd").style.color=ok?"#1f9d55":"#d64545";i++;setTimeout(function(){if(dn)return;$("wd").style.color="";show()},350)}
 show();setTimeout(function(){var p=$("pg");if(p.style)p.style.width=((DUR-1)/DUR*100)+"%"},50);
 iv=setInterval(function(){left--;$("tm").textContent=left;$("pg").style.width=(left/DUR*100)+"%";if(left<=0)end()},1000);
 $("stop").onclick=end}
window.__multiPools=function(){return FAMS};window.__multiStats=function(){var o={};["v","p","w","n"].forEach(function(k){o[k]={};["e","m","h"].forEach(function(lvl){o[k][lvl]=FAMS[k].reduce(function(a,f){return a+f.items.filter(function(x){return x.l==lvl}).length},0)})});return o}
})();
