*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;background:radial-gradient(circle at 50% 0,var(--bg) 0,var(--bg2) 100%) fixed}
main{max-width:480px;margin:0 auto;padding:58px 18px 40px}

h1{font-size:3.4rem;line-height:1;text-align:center}

h2{font-size:1.6rem;margin-bottom:10px}
p{margin:.5rem 0;line-height:1.45}
.c{text-align:center}
.btn{display:block;width:100%;border:0;border-radius:40px;padding:.95rem 1rem;margin:12px 0;font:inherit;font-size:1.25rem;font-weight:900;letter-spacing:.02em;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}

.btn.red{background:var(--red)}.btn.teal{background:var(--teal);color:#06302B}.btn.yel{background:var(--yel);color:#3A2A00}
.btn.sm{font-size:1rem;padding:.7rem}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:4px solid #fff;outline-offset:2px}
.card{background:var(--card);color:var(--ink);border-radius:18px;padding:16px;margin:14px 0}
.q{font-weight:900;text-transform:uppercase;font-size:1.15rem;text-align:center;margin:0}
.bar{height:12px;background:var(--line);border-radius:10px;margin:12px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--hi);transition:width 1s linear}
.tm{font-weight:900;font-size:1.3rem;color:var(--ink)}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--row);color:var(--ink);font:inherit;font-weight:800;text-transform:uppercase;padding:.8rem 1rem;cursor:pointer;text-align:left;font-size:1rem}
.row:last-child{border-bottom:0}
.row[aria-pressed="true"]{background:var(--hi)}
.row[aria-pressed="true"].neg{background:var(--bomb);color:#fff}
.row .p{font-weight:900;min-width:2rem;text-align:right}
.sc{display:flex;justify-content:space-between;font-weight:800}
.tog{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line);font-weight:800}
.tog input{width:44px;height:24px;accent-color:var(--teal)}
input.t{width:100%;font:inherit;font-size:1.1rem;padding:.8rem 1rem;border-radius:12px;border:3px solid var(--line);margin:6px 0 12px;color:var(--ink);background:#fff}
select.t{width:100%;font:inherit;font-size:1.1rem;padding:.8rem 1rem;border-radius:12px;border:3px solid var(--line);margin:6px 0 12px;color:var(--ink);background:#fff}

.miss{opacity:.75;font-size:.95rem}
:root{--vio:#7A3FE0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:160px;border:0;border-radius:22px;color:#fff;font-family:inherit;cursor:pointer;padding:12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tile:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tile .ti{font-size:3rem;line-height:1}.tile .tn{font-weight:900;font-size:1.15rem}.tile .ts{font-size:.8rem;opacity:.92}
.t1{background:#16A5A0}
.t5{background:#F26B21}.t6{background:#2FA84F}.t7{background:#2D7FF9}.t8{background:#E0409A}.t9{background:#475569}.t10{background:#0891B2}.tile.wide{grid-column:1/-1;min-height:110px}.t2{background:#E5484D}.t3{background:#F2B01E;color:#2a1d00}.t4{background:var(--vio)}

.tile.mini .ti{font-size:1.6rem}

.trow{display:flex;gap:8px;align-items:flex-end}.trow label{flex:1;min-width:0}.trow select{flex:0 0 47%;width:47%;margin-bottom:12px;padding-left:.6rem;padding-right:.2rem;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.btn:active{transform:none}}
</style>
</head>

  btn("ok","teal",T("vld"),guess);btn("pn","red sm",T("pas"),function(){reveal(0)});

 function clue(){var h="";for(var j=0;j<=k;j++)h+=(j+1)+". "+it.c[j][l]+"<br>";$("wd").innerHTML=h;$("opts").innerHTML="";
  btn("yes","teal",T("fnd")+" (+"+(3-k)*mm()+")",function(){res.push([it.n[l],1]);sc+=(3-k)*mm();upd();i++;show()});
  if(k<2)btn("nx","yel",T("nxc"),function(){k++;clue()});

  var lab=t=="v"?it.s[l]+" — "+(it.a?T("tru"):T("fls")):it.q[l]+" "+it.o[it.a][l];res.push([lab,ok?1:0]);

 show();if(!PQ){setTimeout(function(){var p=$("pg");if(p.style)p.style.width=((DUR-1)/DUR*100)+"%"},50);

var _mk2=mkRounds;mkRounds=function(mode,total,N){
 if(mode!="n"){var r=_mk2(mode,total,N);if(mode=="y"){var alt=null,done=0;r=r.map(function(x,i){if(x.t!="n")return x;if(!done){done=1;return mkRounds("n",1,N)[0]}if(!alt)alt=_mk2("p",total,N);return alt[i]})}return r}
 var NQ=7,need={},pools={},pos={},out=[],j,lv;
 for(j=0;j<NQ;j++){lv=TLV[j%N]||LV;need[lv]=(need[lv]||0)+1}

function comp(x){
 var N=G.n.length,NQ=x.w.length,l=li(),q=0,it,iv,dn=0;
 function fmt(v){return String(v).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
 function alive(){return !!document.getElementById("cw")}
 function stop(){clearInterval(iv)}
 app.innerHTML='<div class="c"><h2>'+T("tnn")+'</h2></div><div class="card"><p style="margin:0">'+T("rnc")+'</p></div><button class="btn red" id="st">'+T("stt")+'</button>';

 function nextQ(){stop();if(q>=NQ){ssave();scores();return}it=x.w[q];mark("n",it.id);think()}
 function head(){return T("cpQ")+" "+(q+1)+"/"+NQ+" · ×"+(LM[it.l]||1)}
 function inputs(dis){var h="";for(var i=0;i<N;i++)h+='<label style="display:block;margin-bottom:6px">'+G.n[i]+'<input class="t cin" id="c'+i+'" type="text" inputmode="decimal" autocomplete="off" '+(dis?"disabled ":"")+'style="width:100%;text-align:center;font-size:1.4rem;margin-top:2px" placeholder="?"></label>';return h}
 function timer(sec,done){var left=sec,pg=$("pg");$("tm").textContent=left;pg.style.transition="none";pg.style.width="100%";void pg.offsetWidth;pg.style.transition="width "+sec+"s linear";pg.style.width="0%";
  iv=setInterval(function(){if(!alive()){stop();return}left--;$("tm").textContent=Math.max(left,0);if(left<=0){stop();done()}},1000)}
 function think(){
  app.innerHTML='<div class="card c" id="cw"><div class="bar"><i id="pg"></i></div><div class="sc"><span class="tm" id="tm">15</span><span id="ph">'+T("cpT")+'</span></div><p class="miss" style="margin:6px 0">'+head()+'</p><p class="q" style="font-size:1.4rem;margin:12px 0">'+it.q[l]+'</p></div><div class="card" id="cb">'+inputs(1)+'</div><button class="btn yel sm" id="sk">'+T("cpS")+'</button>';
  $("sk").onclick=function(){stop();write()};timer(15,write)}
 function write(){
  if(!alive())return;$("ph").textContent=T("cpW");$("ph").style.color="#d64545";
  var cin=document.querySelectorAll(".cin");cin.forEach(function(e,i){e.disabled=false;e.onkeydown=function(ev){if(ev.key=="Enter"){ev.preventDefault();if(i<N-1)cin[i+1].focus();else{stop();reveal()}}}});
  try{cin[0].focus()}catch(e){}
  var sk=$("sk");sk.textContent=T("vld");sk.className="btn red";sk.onclick=function(){stop();reveal()};$("tm").textContent="✍️";$("pg").style.transition="none";$("pg").style.width="0%"}
 function reveal(){
  if(dn&&dn==q+1||!alive())return;dn=q+1;stop();
  var cin=document.querySelectorAll(".cin"),mult=LM[it.l]||1,A=[],best=Infinity,i;
  for(i=0;i<N;i++){var raw=(cin[i]?cin[i].value:"").replace(/\s/g,"").replace(",","."),v=parseFloat(raw);if(isNaN(v)){A.push(null)}else{var d=Math.abs(v-it.v);A.push({v:v,d:d});if(d<best)best=d}}
  var rows="";
  for(i=0;i<N;i++){var a=A[i],win=a&&a.d==best;if(win)G.pts[i]+=mult;
   rows+='<div class="row '+(win?"ok":"ko")+'"><span>'+(win?"🏆 ":"")+G.n[i]+' : '+(a?fmt(a.v)+' · '+T("cpD")+' '+fmt(Math.round(a.d*100)/100):'— '+T("cpX"))+(win?' (+'+mult+')':'')+'</span></div>'}

}
